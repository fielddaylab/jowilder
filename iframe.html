<script>
  (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){
  (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),
  m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)
  })(window,document,'script','//www.google-analytics.com/analytics.js','ga');

  ga('create', 'UA-72694027-9', 'auto', {cookieFlags: 'max-age=7200;secure;samesite=none'});
  // WHERE THE PLAY CAME FROM.
  //
  // Opened by index.html (the click-to-play page, as in the Vault player), this page's referrer is index.html
  // itself, which analytics ignores. The Vault player passes the acquisition source down the embed contract as
  // ?vault_src=<source origin>&vault_ch=<channel> (vault_referrer is the older name for vault_src), and
  // index.html forwards all of them to this page.
  //
  // A referrer alone CANNOT separate Vault plays from direct ones: this page is served from
  // cdn.vaultlearninggames.org, so a vaultlearninggames.org referrer is the same registrable domain and
  // analytics discards it as a self-referral — every Vault play lands in "(direct)" and Vault's contribution is
  // invisible. So the channel is reported as an explicit campaign source instead (utm_source on the reported
  // page location, which analytics prefers over the referrer and never treats as a self-referral). Plays then
  // group by a named source. A partner channel is reported as the partner's own hostname
  // ("pbswisconsineducation.org"), because a referral session that reached us before the player existed was
  // recorded by analytics under that bare host — using the host keeps both sides of the change one continuous
  // row instead of two strings for the same traffic. Partner links that hardcode a short key
  // (?vault_ch=pbswi) are normalised through VAULT_CHANNEL_ALIASES below, so they keep working untouched.
  // "vault" keeps its own name: it has no referral-era row to match (it was the self-referral analytics was
  // discarding) and the site's own host would collide with ordinary on-site navigation.
  /* VAULT_CHANNEL_LOGIC_START */
  var VAULT_CHANNELS = {
    'https://pbskids.org': 'pbskids.org',
    'https://www.pbskids.org': 'pbskids.org',
    'https://pbswisconsineducation.org': 'pbswisconsineducation.org',
    'https://www.pbswisconsineducation.org': 'pbswisconsineducation.org',
    'https://pbslearningmedia.org': 'pbslearningmedia.org',
    'https://www.pbslearningmedia.org': 'pbslearningmedia.org',
    'https://sciencegamecenter.org': 'sciencegamecenter.org',
    'https://www.sciencegamecenter.org': 'sciencegamecenter.org'
  };
  // Short keys partner links already carry, mapped to the hostname we report them as.
  var VAULT_CHANNEL_ALIASES = {
    pbswi: 'pbswisconsineducation.org',
    pbskids: 'pbskids.org',
    pbslm: 'pbslearningmedia.org',
    sciencegamecenter: 'sciencegamecenter.org'
  };
  // The partner hostnames are real referrals, so they are reported with the referral medium analytics groups
  // them under. "vault", "other" and direct plays are not referrals and keep the honest "vault-player".
  var VAULT_PARTNER_CHANNELS = Object.keys(VAULT_CHANNEL_ALIASES).map(function (k) { return VAULT_CHANNEL_ALIASES[k]; });
  function vaultResolveChannel(rawCh, source, embedded) {
    var channel = rawCh || '';
    // An explicit vault_ch is reported exactly as given, so the short keys are normalised here — right where
    // the value is read, before anything is reported, and not only on the VAULT_CHANNELS fallback below.
    if (Object.prototype.hasOwnProperty.call(VAULT_CHANNEL_ALIASES, channel)) channel = VAULT_CHANNEL_ALIASES[channel];
    // No channel, but a source we recognise: name it anyway.
    if (!channel && /^https:\/\//.test(source)) channel = VAULT_CHANNELS[new URL(source).origin] || 'other';
    // Inside the Vault player with no outside source: the play came through Vault itself.
    if (!channel && embedded) channel = 'vault';
    return {
      channel: channel,
      medium: VAULT_PARTNER_CHANNELS.indexOf(channel) !== -1 ? 'referral' : 'vault-player'
    };
  }
  /* VAULT_CHANNEL_LOGIC_END */
  try {
    var params = new URL(location.href).searchParams;
    var source = params.get('vault_src') || params.get('vault_referrer') || '';
    // The source site's own address is still worth reporting as the referrer when we were given one.
    if (/^https:\/\//.test(source)) ga('set', 'referrer', source);
    else if (document.referrer && new URL(document.referrer).host === location.host && parent !== window && parent.document.referrer)
      ga('set', 'referrer', parent.document.referrer);
    var resolved = vaultResolveChannel(params.get('vault_ch'), source, parent !== window);
    var channel = resolved.channel;
    if (channel) {
      var reported = new URL(location.href);
      reported.searchParams.set('utm_source', channel);
      reported.searchParams.set('utm_medium', resolved.medium);
      ga('set', 'location', reported.href);
      ga('set', 'dimension1', channel);   // registered as "Play source" on the property
    }
  } catch (e) {}
  ga('send', 'pageview');
</script>

<script type="text/javascript">
var g;
var game_width  = 880;
var game_height = 660;
var game_first_audio_played = 0;
var unplayed_audio_queue = [];
var playHandlePromise = function(audio,q)
{
  r = audio.play();
  if(!r) return;
  r.catch(function(err){
    if(!q) return;
    for(var i = 0; i < unplayed_audio_queue.length; i++)
      if(unplayed_audio_queue[i] == audio) return;
    unplayed_audio_queue.push(audio);
  });
}
function flush_unplayed_audio()
{
  for(var i = 0; i < unplayed_audio_queue.length; i++)
  {
    var r = unplayed_audio_queue[i].play();
    if(r) r.catch(noop);
  }
  unplayed_audio_queue = [];
}
function break_unplayed_audio()
{
  unplayed_audio_queue = [];
}
function fullscreen()
{
  var el = document.body;
  var requestMethod = el.requestFullscreen || el.webkitRequestFullScreen || el.mozRequestFullScreen || el.msRequestFullscreen;
  if(requestMethod) requestMethod.call(el);
}
function unfullscreen()
{
  var el = document;
  var exitMethod = el.exitFullscreen || el.webkitExitFullscreen || el.mozCancelFullScreen || el.msExitFullscreen;
  if(exitMethod) exitMethod.call(el);
}

function size_containers(w,h)
{
  var stage_container_container = document.getElementById("BrainPOPsnapArea"); //stage_container_container_because_javascript_is_terrible
  stage_container_container.style.width = w; stage_container_container.style.height = h;
  var stage_container = document.getElementById("stage_container");
  stage_container.style.width = w; stage_container.style.height = h;
}

function resize()
{
  var w = window.innerWidth;
  var h = window.innerHeight;
  //if(w > game_width)  w = game_width;
  //if(h > game_height) h = game_height;
  //if(h < game_height) w = h/game_height*game_width;
  w = h/game_height*game_width;
  if(g) g.resize({width:w,height:h});
  size_containers(w,h);
}
function begin()
{
  var w = game_width;
  var h = game_height;
  size_containers(w,h);

  var first_audio = GenAudio("assets/silence.mp3");
  var play_first_audio = function()
  {
    first_audio.play();
    game_first_audio_played = 1;
    if(platform == "PC")          stage_container.removeEventListener('mousedown',  play_first_audio);
    else if(platform == "MOBILE") stage_container.removeEventListener('touchstart', play_first_audio);

    if(platform == "PC")          stage_container.addEventListener('mousedown',  flush_unplayed_audio);
    else if(platform == "MOBILE") stage_container.addEventListener('touchstart', flush_unplayed_audio);
  }
  if(platform == "PC")          stage_container.addEventListener('mousedown',  play_first_audio);
  else if(platform == "MOBILE") stage_container.addEventListener('touchstart', play_first_audio);
  game_first_audio_played = 1; first_audio.play(); //comment this out if loaded _not_ through click-to-init iframe

/*
  var try_fullscreen = function()
  {
    fullscreen();
    if(platform == "PC")          stage_container.removeEventListener('mousedown', try_fullscreen);
    else if(platform == "MOBILE") stage_container.removeEventListener('touchstart', try_fullscreen);
  }
  if(platform == "PC")          stage_container.addEventListener('mousedown', try_fullscreen);
  else if(platform == "MOBILE") stage_container.addEventListener('touchstart', try_fullscreen);
*/

  g = new Game({width:w,height:h,container:"stage_container"});
  resize();
  g.begin();
}
window.addEventListener("touchstart", function(e){ e.preventDefault() }); //prevent browser from doing anything funny
window.addEventListener("load",begin,false);
window.addEventListener("resize",resize,false);
</script>
